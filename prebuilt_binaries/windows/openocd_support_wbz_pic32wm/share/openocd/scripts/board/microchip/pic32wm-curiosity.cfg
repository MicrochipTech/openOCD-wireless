#
# Microchip PIC32WM_BZ6204 Curiosity board.
# https://www.microchip.com/en-us/development-tool/ea81w68a
#
# Cold-Plug support for DEBUG_LCK secured devices (DS00005953B §5-6):
#   Call  bz6_cold_plug_init  before programming a secured device.
#   Normal (unsecured) devices use the standard init path unchanged.
#
# Secured device (DEBUG_LCK != 0):
#   openocd -f board/microchip/pic32wm-curiosity.cfg \
#           -c "bz6_cold_plug_init; program app.production.signed.hex; shutdown"
#
# Unsecured device (DEBUG_LCK == 0):
#   openocd -f board/microchip/pic32wm-curiosity.cfg \
#           -c "program app.hex verify reset; shutdown"
#

source [find interface/cmsis-dap.cfg]

set CHIPNAME pic32wm

source [find target/pic32wm.cfg]

# Override pic32wm.cfg's default reset config (srst_only + sysresetreq).
# On this device, SYSRESETREQ-based reset does not reliably allow OpenOCD
# to halt the CPU afterward ("timed out while waiting for target halted").
# vectreset (halt via Cortex-M VECTRESET bit in AIRCR, catching the CPU at
# the reset vector) is the reset mechanism confirmed working for 'west
# flash' on this device family — use the same mechanism here for direct
# 'program'/'reset halt' invocations.
reset_config none
cortex_m reset_config vectreset

# Shared cold-plug procs (bz6_cold_plug, bz6_dap_powerup,
# bz6_verify_device_state, bz6_cold_plug_init)
source [find target/microchip/bz6_cold_plug.tcl]
