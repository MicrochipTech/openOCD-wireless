# OpenOCD Target Config for Microchip PIC32WM_BZ6
# Author: Dinesh Arasu (dinesh.arasu@microchip.com)

# --- Setup DAP and CPU ---
source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME pic32wm
}

set _ENDIAN little

if { [info exists DAP_TAPID] } {
   set _DAP_TAPID $DAP_TAPID
} else {
   set _DAP_TAPID 0x04D8810B
}

transport select swd

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
# Note: -defer-examine is NOT used here. For DEBUG_LCK secured devices,
# handle_init_command fails at 'transport init' (SWD DPIDR unreadable before
# cold-plug) and never reaches target_examine, so deferral is unnecessary.
# For unsecured devices, normal examination via CPUID must succeed for
# GDB / west flash to work correctly.
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

# --- Work Area in RAM ---
$_TARGETNAME configure -work-area-phys 0x20000000 \
                       -work-area-size 0x80000 \
                       -work-area-backup 0

# --- Reset Behavior ---
# DIAGNOSTIC: dsu_reset_deassert auto-fire via reset-deassert-post DISABLED.
# Testing showed this breaks blinky on unsecured devices — it issues an
# extra uncontrolled AIRCR SYSRESETREQ on EVERY reset event, interfering
# with the working vectreset-based reset flow (board config). The
# 'pic32cx_bz dsu_reset_deassert' command remains available to invoke
# manually if ever needed for a specific secured-device scenario.
#$_TARGETNAME configure -event reset-deassert-post {
#        pic32cx_bz dsu_reset_deassert
#}

reset_config srst_only srst_nogate

adapter speed 1000

if {![using_hla]} {
   # if srst is not fitted use SYSRESETREQ to
   # perform a soft reset
   cortex_m reset_config sysresetreq
}

# --- Flash Banks ---
flash bank pic32wm_flash pic32cx_bz 0x01000000 0x00200000 0 0 $_TARGETNAME

# NOTE: 0x00000000-0x0000FFFF is "Secure Boot ROM" (masked ROM, not flash) per
# the device memory map. The eFuse controller's "fuses" panel (SECCFG,
# lifecycle counter, anti-rollback counter, secure boot key, storage key,
# UUID) is ALSO addressed starting at 0x0 but is a logically separate
# peripheral (ROT macro at 0x44003000, EFUSE_RWDATA/EFUSE_CON registers),
# not memory-mapped flash. This bank represents that eFuse panel (size
# matches ATDF 'fuses' address-space: 0x200 bytes) so that hex file data in
# this range is routed to pic32cx_efuse_write() instead of NVMCON/QDW.
flash bank pic32wm_efuse pic32cx_bz 0x00000000 0x200 0 0 $_TARGETNAME

flash bank pic32wm_boot pic32cx_bz 0x00800000 0x10000 0 0 $_TARGETNAME

flash bank pic32wm_device_config pic32cx_bz 0x00810000 0x1000 0 0 $_TARGETNAME

flash bank pic32wm_otp_config pic32cx_bz 0x00811000 0x1000 0 0 $_TARGETNAME

flash bank pic32wm_config_CM4F pic32cx_bz 0xE000ed10 0x100 0 0 $_TARGETNAME
