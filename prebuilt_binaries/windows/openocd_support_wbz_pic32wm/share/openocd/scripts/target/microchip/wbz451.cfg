# OpenOCD Target Config for Microchip WBZ451
# Author: Dinesh Arasu (dinesh.arasu@microchip.com)

# --- Setup DAP and CPU ---
source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME wbz451
}

set _ENDIAN little

if { [info exists DAP_TAPID] } {
   set _DAP_TAPID $DAP_TAPID
} else {
   set _DAP_TAPID 0x04D8810B
}

transport select swd

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

# --- Work Area in RAM ---
$_TARGETNAME configure -work-area-phys 0x20000000 \
                       -work-area-size 0x20000 \
                       -work-area-backup 0

# --- Reset Behavior ---
# Use SYSRESETREQ via the debug interface for reliable reset.
# SRST-based reset does not work reliably with CMSIS-DAP on this board.
# reset_config srst_only srst_nogate

$_TARGETNAME configure -event reset-deassert-post {
        mwb 0x44000001 0x02
        mww 0x44000100 0x8000
        mww 0xE000ED0C 0x05FA0004
        mww 0xE000ED0C 0x05FA0000
        sleep 100
}

adapter speed 1000

if {![using_hla]} {
   cortex_m reset_config sysresetreq
}

# --- Flash Banks ---
flash bank wbz451.flash pic32cx_bz 0x01000000 0x00100000 0 0 $_TARGETNAME

flash bank wbz451.boot pic32cx_bz 0x00000000 0x5000 0 0 $_TARGETNAME

flash bank wbz451.deviceconfig pic32cx_bz 0x00005000 0x1000 0 0 $_TARGETNAME

flash bank wbz451.otp pic32cx_bz 0x00006000 0x1000 0 0 $_TARGETNAME

flash bank wbz451.configbits pic32cx_bz 0x00045000 0x2000 0 0 $_TARGETNAME
